<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نگاهی به ارزش‌های مجاهدین</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0d1117; color: #e0e6f0;
    font-family: Tahoma, Arial, sans-serif;
    min-height: 100vh; display: flex;
    justify-content: center; padding: 24px 12px;
  }
  .container {
    width: 100%; max-width: 480px;
    background: #161d2b; border-radius: 18px;
    padding: 28px 20px 32px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.5);
    height: fit-content;
  }
  h1 {
    text-align: center; color: #3ab4f2;
    font-size: 1.35rem; font-weight: 700;
    line-height: 1.5; margin-bottom: 24px;
  }
  .player-box {
    background: #1e2a3a; border-radius: 14px;
    padding: 18px 16px; margin-bottom: 24px;
  }
  audio { width: 100%; border-radius: 30px; }
  .track-list { display: flex; flex-direction: column; gap: 10px; }
  .track-item {
    display: flex; align-items: center;
    justify-content: space-between;
    background: #1e2a3a; border-radius: 12px;
    padding: 14px 14px; cursor: pointer;
    border: 2px solid transparent;
    transition: border-color 0.2s, background 0.2s; gap: 12px;
  }
  .track-item:hover { border-color: #3ab4f2; }
  .track-item.active { border-color: #3ab4f2; background: #1b2d42; }
  .track-num {
    width: 32px; height: 32px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.85rem; font-weight: 600; flex-shrink: 0;
    background: #2e3d54; color: #8aa5c0;
  }
  .track-item.active .track-num { background: #3ab4f2; color: #fff; }
  .track-name {
    flex: 1; text-align: right;
    font-size: 1rem; font-weight: 600; color: #d0dce8;
  }
  .play-btn {
    width: 36px; height: 36px; border-radius: 50%;
    background: #3ab4f2; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .play-btn svg { fill: #fff; width: 14px; height: 14px; }
</style>
</head>
<body>
<div class="container">
  <h1>نگاهی به ارزش‌های مجاهدین</h1>
  <div class="player-box">
    <audio id="mainAudio" controls preload="none" playsinline webkit-playsinline></audio>
  </div>
  <div class="track-list" id="trackList"></div>
</div>
<script>
var N = ["راز ماندگاری", "فدا و صداقت", "صدق و صداقت", "آرمان‌گرایی", "مبارزه با فردیت", "بی‌چشم‌داشتی و بی‌نام و نشانی", "هنر شنیدن", "یگانگی با جمع", "شفافیت و عبور از خود", "به دل نگرفتن و گذشت"];
var cur = -1;
var audio = document.getElementById('mainAudio');
var list = document.getElementById('trackList');

for (var i = 0; i < N.length; i++) {
  (function(idx) {
    var item = document.createElement('div');
    item.className = 'track-item';
    item.id = 'item' + idx;
    item.innerHTML =
      '<button class="play-btn" onclick="event.stopPropagation();playTrack(' + idx + ')">' +
      '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>' +
      '<span class="track-name">' + N[idx] + '</span>' +
      '<span class="track-num">' + (idx+1) + '</span>';
    item.addEventListener('click', function() { playTrack(idx); });
    list.appendChild(item);
  })(i);
}

function setActive(i) {
  var items = list.querySelectorAll('.track-item');
  for (var j = 0; j < items.length; j++) items[j].classList.toggle('active', j === i);
}

function playTrack(i) {
  setActive(i);
  if (cur !== i) {
    audio.src = (i + 1) + '.mp3';
    cur = i;
  }
  var p = audio.play();
  if (p && p.catch) p.catch(function() {});
}

audio.addEventListener('ended', function() {
  if (cur < N.length - 1) playTrack(cur + 1);
});
</script>
</body>
</html>
